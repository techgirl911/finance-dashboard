<!-- public/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finance Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>

  <header class="topbar">
    <h1>💰 Finance Dashboard</h1>
    <div id="authArea" class="auth-area"></div>
  </header>

  <div id="demoBanner" class="demo-banner hidden">
    You're in demo mode — showing limited results.
    <a href="#" id="upgradeLink">Upgrade for full access</a>
  </div>

  <main class="layout" id="app">

    <section class="summary-cards">
      <div class="card income">
        <span class="card-label">Income</span>
        <span class="card-value" id="incomeValue">—</span>
      </div>
      <div class="card expense">
        <span class="card-label">Expenses</span>
        <span class="card-value" id="expenseValue">—</span>
      </div>
      <div class="card net">
        <span class="card-label">Net</span>
        <span class="card-value" id="netValue">—</span>
      </div>
    </section>

    <section class="chart-row">
      <div class="chart-box">
        <h2>Spending by category</h2>
        <canvas id="categoryChart"></canvas>
        <p id="noCategoryData" class="empty-note hidden">No expenses yet this month.</p>
      </div>

      <div class="budget-box">
        <h2>Budgets</h2>
        <div id="budgetList" class="budget-list"></div>
        <form id="budgetForm" class="budget-form">
          <select id="budgetCategory"></select>
          <input type="number" id="budgetLimit" placeholder="Monthly limit" min="0" step="1" required />
          <button type="submit">Set Budget</button>
        </form>
        <p class="form-error" id="budgetError"></p>
      </div>
    </section>

    <section class="transactions-section">
      <div class="section-header">
        <h2>Transactions</h2>
        <button id="addTransactionBtn">+ Add Transaction</button>
      </div>
      <div id="transactionList" class="transaction-list"></div>
    </section>

  </main>

  <!-- Add transaction modal -->
  <div id="transactionModal" class="modal hidden">
    <div class="modal-content">
      <button id="closeTransactionModal" class="close-btn">&times;</button>
      <h2>Add Transaction</h2>
      <form id="transactionForm" class="transaction-form">
        <div class="type-toggle">
          <button type="button" class="type-btn active" data-type="expense">Expense</button>
          <button type="button" class="type-btn" data-type="income">Income</button>
        </div>
        <input type="number" id="txAmount" placeholder="Amount" min="0" step="1" required />
        <select id="txCategory"></select>
        <input type="text" id="txDescription" placeholder="Description (optional)" />
        <input type="date" id="txDate" required />
        <button type="submit">Add</button>
        <p class="form-error" id="txError"></p>
      </form>
    </div>
  </div>

  <!-- Add category modal -->
  <div id="categoryModal" class="modal hidden">
    <div class="modal-content">
      <button id="closeCategoryModal" class="close-btn">&times;</button>
      <h2>New Category</h2>
      <form id="categoryForm" class="category-form">
        <input type="text" id="catName" placeholder="Category name" required />
        <select id="catType">
          <option value="expense">Expense</option>
          <option value="income">Income</option>
        </select>
        <input type="color" id="catColor" value="#5eead4" />
        <button type="submit">Create</button>
        <p class="form-error" id="catError"></p>
      </form>
    </div>
  </div>

  <!-- Auth modal -->
  <div id="authModal" class="modal hidden">
    <div class="modal-content">
      <button id="closeAuthModal" class="close-btn">&times;</button>
      <div class="auth-tabs">
        <button id="tabLogin" class="tab active">Login</button>
        <button id="tabRegister" class="tab">Register</button>
      </div>

      <form id="loginForm" class="auth-form">
        <input type="email" id="loginEmail" placeholder="Email" required />
        <input type="password" id="loginPassword" placeholder="Password" required />
        <button type="submit">Login</button>
        <p class="form-error" id="loginError"></p>
      </form>

      <form id="registerForm" class="auth-form hidden">
        <input type="text" id="registerName" placeholder="Name" required />
        <input type="email" id="registerEmail" placeholder="Email" required />
        <input type="password" id="registerPassword" placeholder="Password (min 6 chars)" required />
        <button type="submit">Create Account</button>
        <p class="form-error" id="registerError"></p>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
